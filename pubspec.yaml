name: cinto_final
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_view: ^0.14.0
  
  # UI e utilitários
  image_picker: ^1.0.4
  path_provider: ^2.1.0
  path: ^1.8.3
  share_plus: ^7.2.1
  
  # Processamento de imagens e PDF
  image: ^4.1.3
  pdf: ^3.10.7
  
  # Requisições HTTP
  http: ^1.1.0
  dio: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1  # 🔥 Para mudar o ícone do app

flutter:
  uses-material-design: true
  
  assets:    
    - assets/fonts/arial.ttf
    - assets/fonts/arialbd.ttf
    - assets/imagem/logo_seguranca.png
    - assets/imagem/logo_empresa.png
    - assets/imagem/cinto_seguranca.png
    - assets/imagem/tombador_nr12.png
    - assets/imagem/logo_rampa.png
    - assets/icon/icone_app.png  # 🔥 Adicione sua imagem de ícone aqui

# 🔥 CONFIGURAÇÃO DO ÍCONE DO APP
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icone_app.png"
  remove_alpha_ios: true